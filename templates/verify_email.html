<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <meta content="web_standard" name="shell-type"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;700&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap" rel="stylesheet"/>
  <style>
    @layer base {
      html, body { margin: 0; padding: 0; }
      body { overscroll-behavior: none; }
      main > :first-child { margin-top: 0 !important; }
      main > :last-child { margin-bottom: 0 !important; }
    }
    ::-webkit-scrollbar { display: none; }
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      "darkMode": "class",
      "theme": {
        "extend": {
          "colors": {
            "primary": "#004ac6",
            "on-primary-container": "#eeefff",
            "surface-variant": "#dae2fd",
            "on-background": "#131b2e",
            "secondary-fixed-dim": "#b7c4ff",
            "error-container": "#ffdad6",
            "on-error": "#ffffff",
            "surface-container-highest": "#dae2fd",
            "tertiary": "#006242",
            "surface-tint": "#0053db",
            "on-secondary-fixed": "#001551",
            "on-primary": "#ffffff",
            "primary-container": "#2563eb",
            "on-secondary-container": "#fffbff",
            "primary-fixed": "#dbe1ff",
            "secondary": "#1d4ed8",
            "error": "#ba1a1a",
            "on-surface": "#131b2e",
            "outline": "#737686",
            "surface-bright": "#faf8ff",
            "surface-container-high": "#e2e7ff",
            "surface-container-lowest": "#ffffff",
            "surface-container": "#eaedff",
            "surface": "#faf8ff",
            "surface-container-low": "#f2f3ff"
          }
        }
      }
    };
  </script>
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>Verify Your Email - Fameweb</title>
</head>
<body class="bg-surface font-body-md text-body-md text-on-surface antialiased">
  <header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]">
    <div class="h-16 max-w-7xl mx-auto px-space-lg flex items-center justify-between">
      <div class="flex items-center gap-space-md">
        <img alt="Fameweb Logo" class="h-8 w-auto object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1VZtbkcRVrLGtpSv5Ok_0JuX0Eyt04IrbKPiRofwFPTJmvJcbCgerPrirTkTzd8_fCXLgXAwm35syFrTK0FgQ2i4tCfDuweIVAmTtW3i2eUDa8hpNmtqrcSdx_QlW583uGqF_VaNsfHj6N43q2zJvcDkZ3dq7SBq_gnULmB1KMkdAex4HPUU3__4SyLBIfKNGPC2kP9w0SJOT3-YVP5WCrUbL3zgrb0Gv2swDRK-xluwRay_A4XEMxCU0o"/>
        <span class="font-headline-md text-headline-md text-primary tracking-tight font-semibold">Fameweb</span>
      </div>
      <div class="flex items-center gap-space-md">
        <a class="text-sm font-medium text-on-surface-variant hover:text-on-surface transition-colors" href="/login">Sign In</a>
      </div>
    </div>
  </header>

  <main class="w-full pt-16 bg-surface">
    <div class="relative w-full min-h-[calc(100vh-4rem)] flex items-center justify-center p-4 sm:p-8 overflow-hidden">
      <!-- Glows -->
      <div class="absolute -top-32 -left-32 w-96 h-96 bg-primary/5 rounded-full blur-3xl pointer-events-none"></div>
      <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-secondary-container/10 rounded-full blur-3xl pointer-events-none"></div>

      <div class="w-full max-w-[460px] relative z-10 my-6">
        <div class="bg-surface-container-lowest shadow-xl rounded-xl p-6 sm:p-8 transition-all">
          <!-- Icon & Header -->
          <div class="flex flex-col items-center text-center mb-6">
            <div class="w-14 h-14 rounded-2xl bg-surface-container-low flex items-center justify-center mb-4 shadow-sm text-primary">
              <span class="material-symbols-outlined text-[32px]">mark_email_read</span>
            </div>
            <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container-high text-primary font-mono text-xs uppercase tracking-wider mb-2">
              <span>Security Check</span>
            </div>
            <h1 class="text-2xl font-bold text-on-surface tracking-tight">Verify your email</h1>
            <p class="text-sm text-on-surface-variant mt-2 max-w-sm">
              We sent a 6-digit verification code to
            </p>
            <p class="text-sm font-semibold text-primary break-all mt-0.5" id="target-email-display">
              {% if user and user.email_id %}{{ user.email_id }}{% else %}your email address{% endif %}
            </p>
          </div>

          <!-- Alert / Feedback Notification -->
          <div class="hidden mb-4 p-3 rounded-lg text-sm flex items-start gap-2.5 transition-all" id="status-banner">
            <span class="material-symbols-outlined text-[20px] shrink-0" id="status-banner-icon">info</span>
            <div class="flex-1" id="status-banner-text"></div>
          </div>

          <!-- OTP Form -->
          <form class="flex flex-col gap-4" id="otp-form">
            <div class="flex flex-col gap-2">
              <label class="text-xs font-semibold uppercase tracking-wider text-on-surface-variant flex justify-between items-center" for="otp-input">
                <span>Enter 6-Digit Code</span>
                <span class="text-xs font-normal text-outline flex items-center gap-1" id="expiry-timer-container">
                  <span class="material-symbols-outlined text-[14px]">timer</span>
                  <span id="expiry-timer">10:00</span>
                </span>
              </label>

              <input
                type="text"
                id="otp-input"
                name="otp"
                maxlength="6"
                pattern="[0-9]*"
                inputmode="numeric"
                autocomplete="one-time-code"
                placeholder="000000"
                class="w-full text-center text-3xl font-mono tracking-[0.5em] py-3 px-4 bg-surface-container-low border border-surface-container rounded-lg focus:outline-none focus:bg-surface-container-lowest focus:border-primary focus:shadow-[0_0_0_2px_#004ac6] transition-all font-bold text-on-surface"
                required
                autofocus
              />
            </div>

            <!-- Verify CTA Button -->
            <button
              id="btn-verify-otp"
              type="submit"
              class="w-full mt-2 py-3 px-4 bg-primary hover:bg-secondary text-on-primary font-semibold text-sm rounded-lg shadow-md hover:shadow-lg transition-all flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed"
            >
              <span>Verify & Continue</span>
              <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
            </button>
          </form>

          <!-- Resend Section -->
          <div class="mt-6 pt-4 border-t border-surface-container flex flex-col items-center gap-2 text-center text-sm text-on-surface-variant">
            <span>Didn't receive the code?</span>
            <button
              id="btn-resend-otp"
              type="button"
              class="text-primary font-medium hover:underline flex items-center gap-1 text-sm disabled:text-outline disabled:no-underline disabled:cursor-not-allowed transition-colors"
            >
              <span class="material-symbols-outlined text-[16px]">refresh</span>
              <span id="resend-text">Resend Code</span>
            </button>
          </div>

          <!-- Bottom Footer Navigation -->
          <div class="mt-4 pt-3 flex items-center justify-center gap-1.5 text-xs text-on-surface-variant">
            <span>Wrong email?</span>
            <a href="/signup" class="text-primary font-semibold hover:underline">Use a different email</a>
            <span class="text-outline">•</span>
            <a href="/login" class="text-primary font-semibold hover:underline">Back to Login</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/static/js/auth/verify_email.js"></script>
</body>
</html>
