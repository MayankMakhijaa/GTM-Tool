<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FameWeb Integrator</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 8px;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #0a66c2;
    }
    .status-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      margin-top: 4px;
    }
    .badge-success { background: #dcfce7; color: #166534; }
    .badge-warning { background: #fef3c7; color: #92400e; }
    .badge-error { background: #fee2e2; color: #991b1b; }
    .btn {
      width: 100%;
      padding: 8px;
      background: #0a66c2;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: block;
      text-align: center;
      text-decoration: none;
      box-sizing: border-box;
    }
    .btn:hover { background: #004182; }
    .note {
      font-size: 11px;
      color: #64748b;
      margin-top: 8px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size: 18px;">⚡</span>
    <div class="title">FameWeb Integrator</div>
  </div>

  <div class="status-card">
    <div style="font-size: 11px; color: #64748b; text-transform: uppercase; font-weight: 600;">LinkedIn Session</div>
    <div id="session-badge" class="badge badge-warning">Checking...</div>
    <div id="session-msg" style="font-size: 11px; margin-top: 6px; color: #334155;"></div>
  </div>

  <a href="https://www.linkedin.com" target="_blank" class="btn" id="btn-open-linkedin">Open LinkedIn</a>

  <div class="note">
    Zero-secret architecture: This extension never extracts, stores, or transmits your cookies or passwords.
  </div>

  <script src="popup.js"></script>
</body>
</html>
